name: Docker Image CI

on:
  push:
    branches: [ "master-custom" ]
  workflow_run:
    workflows: [ "Tag nginx version" ]
    types: [ completed ]

jobs:

  build:

    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compute image tags
      id: meta
      run: |
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          VERSION=$(grep -oE '^ARG[[:space:]]+DIST=nginx:[^[:space:]]+' Dockerfile \
            | sed -E 's/^ARG[[:space:]]+DIST=nginx://')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract nginx version from Dockerfile"
            exit 1
          fi
          echo "tags=lltcggie/https-portal:${VERSION}" >> "$GITHUB_OUTPUT"
        else
          echo "tags=lltcggie/https-portal:latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
